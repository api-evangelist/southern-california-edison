apis:
- aid: southern-california-edison:sce-green-button-connect-my-data
  name: SCE Green Button Connect My Data
  description: SCE's Customer Data Access (CDA) platform, through which a customer
    can authorize a registered third party to receive their electric usage and billing
    data. SCE states on its public third-party page that the program "leverages technology
    consistent with the standard adopted by the North American Energy Standards Board
    (NAESB) to support the Green Button Initiative" and that third parties must have
    "technical system capabilities to complete customer authorization using OAuth 2.0
    and process files that are transferred using bulk API." No base URI, endpoint list,
    OpenAPI definition, scope list, or sandbox is published anywhere on sce.com - the
    interface is disclosed only after a third party registers, provides a Taxpayer
    Identification Number, accepts the Third Party Registration Terms & Conditions,
    and passes an SCE-run connectivity test. The obligation to offer it is a California
    regulatory one, carried in SCE tariff Rule 26 "Release of Customer Data or Energy
    Usage Related Data to Third Parties" (Advice 3087-E, filed 2014-07-30, effective
    2014-08-29, implementing CPUC Decision 14-05-016), which explicitly ties technical
    eligibility criteria to the NAESB ESPI standard.
  humanURL: https://www.sce.com/partners/3rd-party-energy-providers/access-energy-usage-data
  tags:
  - Green Button
  - Customer Data
  - Smart Metering
