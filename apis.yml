- aid: southern-california-edison:sce-drpep-arcgis-rest-services
  name: SCE DRPEP ArcGIS REST Services
  description: The machine-readable grid data layer behind SCE's Distribution Resources
    Plan External Portal (DRPEP). An anonymous, unauthenticated Esri ArcGIS REST service
    catalog (server version 11.1) exposing fifteen hosted FeatureServers covering Integration
    Capacity Analysis circuit segments and constraint layers, distribution circuits,
    Distribution Deferral Opportunity Report and Grid Needs Assessment layers, Locational
    Net Benefit Analysis, PSPS boundaries, fire map, subtransmission and available-load
    heat maps, and load growth penetration. SCE publishes no developer documentation
    for these endpoints, but they are live, key-free, and self-describing over the
    standard Esri ArcGIS REST interface, and a companion ArcGIS Hub open data site
    is served at drpep-sce2.opendata.arcgis.com. This is the one place SCE data is
    genuinely open to any developer without registration.
  humanURL: https://drpep.sce.com/drpep/
  baseURL: https://drpep.sce.com/arcgis_server/rest/services
