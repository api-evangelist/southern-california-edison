artifacts:
  openapi:
    harvested: false
    count: 0
    note: |
      No OpenAPI, Swagger, RAML, AsyncAPI, Postman collection, or any other API
      contract was found on any SCE surface. /openapi.json, /swagger.json,
      /api-docs, and the developer/docs/api subdomains were all probed and all
      404'd or failed to resolve. Nothing was fabricated and the openapi/ directory
      is therefore omitted.
  arcgis:
    harvested: true
    count: 3
    files:
      - path: arcgis/sce-drpep-arcgis-services-catalog.json
        source: https://drpep.sce.com/arcgis_server/rest/services/Hosted?f=json
        status: 200
        fetched: '2026-07-27'
      - path: arcgis/sce-drpep-ica-layer-featureserver.json
        source: https://drpep.sce.com/arcgis_server/rest/services/Hosted/ICA_Layer/FeatureServer?f=json
        status: 200
        fetched: '2026-07-27'
      - path: arcgis/sce-drpep-arcgis-rest-info.json
        source: https://drpep.sce.com/arcgis_server/rest/info?f=json
        status: 200
        fetched: '2026-07-27'
    note: |
      Saved verbatim as fetched. These are Esri ArcGIS REST service descriptors, not
      OpenAPI, and are deliberately kept out of openapi/ so nothing is
      misrepresented.

