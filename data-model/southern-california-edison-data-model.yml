relationships:
- from: ICA_Layer/16 (Substations)
  to: ICA_Layer/0 (ICA - Circuit Segments)
  type: has_many
  via: substation_name
  confidence: high
- from: Distribution_circuits/0 (Distribution Circuits)
  to: ICA_Layer/0 (ICA - Circuit Segments)
  type: has_many
  via: circuit_name
  confidence: high
- from: ICA_Layer/0 (ICA - Circuit Segments)
  to: ICA_Layer/2..15 (ICA constraint layers)
  type: has_one
  via: circuit_name + node_id + section_id
  confidence: high
  note: Each constraint layer (generation/load thermal, steady-state voltage, voltage variation, protection, op
    flex, solar PV static grid, uniform generation/load) is the same segment geometry carrying one limiting criterion.
- from: ICA_Layer/0 (ICA - Circuit Segments)
  to: ICA_Tables/3 (ICA Single Consolidated Table)
  type: has_one
  via: circuit_name + node_id
  confidence: medium
  note: The consolidated table is the tabular projection of the segment layer; joined by name, not declared.
- from: Distribution_circuits/0 (Distribution Circuits)
  to: ICA_Tables/1 (Historical Circuit Load Profile)
  type: has_many
  via: circuit_name
  confidence: medium
- from: Distribution_circuits/0 (Distribution Circuits)
  to: ICA_Tables/4 (Forecasted Circuit Load Profile)
  type: has_many
  via: circuit_name
  confidence: medium
- from: ICA_Layer/16 (Substations)
  to: ICA_Tables/2 (Historical Substation Load Profile)
  type: has_many
  via: substation_name
  confidence: medium
- from: GNA_Layer/2 (GNA - Circuits)
  to: DDOR_Layer/2 (DDOR - Circuits)
  type: has_one
  via: gna_id
  confidence: high
  note: The Distribution Deferral Opportunity Report is scoped to grid needs identified in the Grid Needs Assessment;
    gna_id is carried by both.
- from: GNA_Layer/2 (GNA - Circuits)
  to: GNA_Layer/3 (Circuit Level Planning Assumptions)
  type: has_one
  via: circuit_name
  confidence: high
- from: GNA_Layer/0 (GNA Substations)
  to: GNA_Layer/5 (Substation Level Planning Assumptions)
  type: has_one
  via: substation_name
  confidence: high
- from: Distribution_circuits/0 (Distribution Circuits)
  to: LNBA_Layer/1..3 (LNBA short/mid/long term)
  type: has_many
  via: circuit_name
  confidence: medium
- from: Distribution_circuits/0 (Distribution Circuits)
  to: DRP_PSPS_Layer/1 (PSPS_Circuit)
  type: has_one
  via: circuit_name
  confidence: high
- from: ICA_Layer/19 (SCE Service Territory)
  to: Firemap/0..2 (CPUC fire-threat tiers)
  type: has_many
  via: spatial overlay (no shared key)
  confidence: low
  note: Fire-threat tiers are CPUC polygons with no circuit key; relate them by geometry, not attributes.
exports:
  per_segment_csv: ICA feature layers carry download_link, download_link_microgrid, download_link_forecast and download_link_microgrid_forecast
    per segment.
  bulk_catalog: https://drpep-sce2.opendata.arcgis.com - 47 datasets as CSV/GeoJSON/KML/Shapefile plus DCAT-US 1.1
    and DCAT-AP 2.1.1 feeds.
schemas: json-schema/southern-california-edison-drpep-layers-schema.json
excluded:
  green_button: SCE publishes no data model for Green Button Connect My Data. The only public field-level document
    is the Data Element Descriptions PDF (https://www.sce.com/sites/default/files/inline-files/Data_Element_Descriptions_SCE_1.pdf);
    the ESPI resource model itself is undisclosed, so nothing is asserted here.
